<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Text Submission</title>
    <style>
        :root {
            --primary-color: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #F8FAFC;
            --card-bg: #FFFFFF;
            --text-main: #0F172A;
            --text-muted: #64748B;
            --border-color: #CBD5E1;
            --border-focus: #818CF8;
            --success-color: #059669;
            --error-color: #DC2626;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 40px 20px;
        }

        .container {
            background: var(--card-bg);
            width: 100%;
            max-width: 720px; /* Expanded for larger presentation format */
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 20px 25px -5px rgba(15, 23, 42, 0.08), 0 8px 10px -6px rgba(15, 23, 42, 0.04);
            border: 1px solid #E2E8F0;
        }

        h1 {
            font-size: 1.875rem;
            font-weight: 800;
            letter-spacing: -0.025em;
            margin-bottom: 32px;
            color: var(--text-main);
            text-align: center;
        }

        .form-group {
            margin-bottom: 24px;
        }

        label {
            display: block;
            font-size: 0.95rem;
            font-weight: 600;
            margin-bottom: 8px;
            color: var(--text-main);
        }

        input[type="text"], textarea {
            width: 100%;
            padding: 14px 16px;
            border: 1.5px solid var(--border-color);
            border-radius: 8px;
            font-size: 1.05rem;
            line-height: 1.6;
            color: var(--text-main);
            outline: none;
            transition: all 0.2s ease-in-out;
            background-color: #FAFAFA;
        }

        input[type="text"]:focus, textarea:focus {
            background-color: #FFFFFF;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 4px rgba(79, 70, 229, 0.12);
        }

        textarea {
            resize: vertical;
            min-height: 220px; /* Generous height for longer text input */
        }

        button {
            width: 100%;
            padding: 16px;
            background-color: var(--primary-color);
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 10px;
            box-shadow: 0 4px 6px -1px rgba(79, 70, 229, 0.2);
        }

        button:hover {
            background-color: var(--primary-hover);
            transform: translateY(-1px);
            box-shadow: 0 6px 12px -2px rgba(79, 70, 229, 0.3);
        }

        button:active {
            transform: translateY(0);
        }

        button:disabled {
            background-color: var(--text-muted);
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        /* Status Toast / Banner */
        #status {
            margin-top: 24px;
            padding: 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            text-align: center;
            display: none;
        }

        #status.success {
            display: block;
            background-color: #ECFDF5;
            color: var(--success-color);
            border: 1px solid #A7F3D0;
        }

        #status.error {
            display: block;
            background-color: #FEF2F2;
            color: var(--error-color);
            border: 1px solid #FECACA;
        }

        /* CSS Loading Spinner */
        .spinner {
            width: 18px;
            height: 18px;
            border: 2.5px solid #ffffff;
            border-bottom-color: transparent;
            border-radius: 50%;
            display: inline-block;
            animation: rotation 1s linear infinite;
        }

        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Text Submission</h1>

        <div class="form-group">
            <label for="fullName">Full Name</label>
            <input type="text" id="fullName" placeholder="Jane Doe">
        </div>

        <div class="form-group">
            <label for="userText">Your Text</label>
            <textarea id="userText" placeholder="Enter your text here..."></textarea>
        </div>

        <button id="submitBtn">Submit Data</button>

        <div id="status"></div>
    </div>

    <script>
        const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbx1Ldqj_jdvqxAzlm0ge7zu95rEOhUz9HbyqhiygvuwynGB4ZiJ2SdOCTnlFzSxygsC/exec";

        const submitBtn = document.getElementById('submitBtn');
        const statusDiv = document.getElementById('status');
        const fullNameInput = document.getElementById('fullName');
        const userTextInput = document.getElementById('userText');

        submitBtn.addEventListener('click', function(event) {
            // Guarantee trigger originates strictly from a mouse click
            if (event.detail === 0) {
                return;
            }

            const fullName = fullNameInput.value.trim();
            const userText = userTextInput.value.trim();

            // Form validation
            if (!fullName || !userText) {
                showStatus("Please fill out both fields before submitting.", "error");
                return;
            }

            // Update UI to "Sending" State
            setLoading(true);
            hideStatus();

            const payload = {
                fullName: fullName,
                userText: userText
            };

            fetch(SCRIPT_URL, {
                method: "POST",
                headers: {
                    "Content-Type": "text/plain;charset=utf-8",
                },
                body: JSON.stringify(payload)
            })
            .then(response => response.json())
            .then(data => {
                setLoading(false);
                if(data.result === "success") {
                    showStatus("✓ Data successfully submitted to Google Sheet!", "success");
                    // Clear inputs upon success
                    fullNameInput.value = '';
                    userTextInput.value = '';
                } else {
                    throw new Error(data.error || "Unknown server error");
                }
            })
            .catch(error => {
                setLoading(false);
                showStatus("Error submitting data. Please try again.", "error");
                console.error("Submission Error:", error);
            });
        });

        function setLoading(isLoading) {
            if (isLoading) {
                submitBtn.disabled = true;
                submitBtn.innerHTML = `<span class="spinner"></span> Sending...`;
            } else {
                submitBtn.disabled = false;
                submitBtn.innerHTML = `Submit Data`;
            }
        }

        function showStatus(message, type) {
            statusDiv.className = type;
            statusDiv.innerText = message;
        }

        function hideStatus() {
            statusDiv.className = '';
            statusDiv.style.display = 'none';
        }
    </script>
</body>
</html>
